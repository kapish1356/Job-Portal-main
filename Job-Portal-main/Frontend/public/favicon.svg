<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    @media (prefers-color-scheme: light) {
      .icon { fill: #1e40af; }
    }
    @media (prefers-color-scheme: dark) {
      .icon { fill: #60a5fa; }
    }
  </style>
  
  <!-- Magnifying Glass Circle -->
  <circle class="icon" cx="200" cy="200" r="140" fill="none" stroke-width="40"/>
  
  <!-- Inner Circle -->
  <circle class="icon" cx="200" cy="200" r="100" fill="none" stroke-width="30"/>
  
  <!-- Briefcase -->
  <g class="icon">
    <!-- Briefcase body -->
    <rect x="150" y="180" width="100" height="70" rx="10" fill="none" stroke-width="20"/>
    <!-- Briefcase handle -->
    <rect x="185" y="160" width="30" height="20" rx="5" fill="none" stroke-width="15"/>
    <!-- Briefcase lock -->
    <rect x="195" y="215" width="10" height="15" rx="3"/>
  </g>
  
  <!-- Magnifying Glass Handle -->
  <g class="icon">
    <rect x="290" y="290" width="160" height="50" rx="25" transform="rotate(45 370 315)"/>
  </g>
</svg>
